name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the whole workflow: these jobs read the repository and
# build it. Nothing writes to the repo, publishes a package, posts a comment,
# or requests an OIDC token — so the default write-capable token is handed back
# down to read-only, and a job that starts needing more has to say so out loud.
permissions:
  contents: read

jobs:
  checks:
    name: Sync, catalog, fixtures, determinism, site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, comments, or calls the API, so the
          # checkout token has no job to do after the clone. Leaving it out of
          # .git/config keeps it away from anything the build runs.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sync
      - run: npm run check:demos
      - run: npm run check:brand
      - run: npm run check:figures
      - run: npm run check:catalog-signals
      - run: npm run check:doc-numbers
      - run: npm run check:format
      - run: npm run check:color
      - run: npm run check:plugins
      - run: npm run check:grid
      - run: npm run check:fixtures
      - run: npm run check:determinism
      - run: npm run check:schemas
      - run: npm run check:cli
      - run: npm run check:component-tier
      - run: npm run check:tokens-studio
      - run: npm run check:manifests
      - run: npm run check:encoding
      - run: npm run check:bootstrap-surface
      - run: npm run check:coverage-bar
      - run: npm run check:minimal-ds
      - run: npm run check:demo-parity
      - run: npm run site:build

  demo-projects:
    name: Build demo — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - acme-demo-bootstrap
          - acme-demo-shadcn
          - acme-demo-daisyui
          - acme-demo-echarts
          - acme-demo-storybook
          - acme-demo-css-variables
          - acme-demo-radix
          - acme-demo-primeng
          - acme-demo-mantine
          - acme-demo-chakra
          - acme-demo-mui
          - cathode-demo-bootstrap
          - cathode-demo-shadcn
          - cathode-demo-daisyui
          - cathode-demo-echarts
          - cathode-demo-storybook
          - cathode-demo-css-variables
          - cathode-demo-radix
          - cathode-demo-primeng
          - cathode-demo-mantine
          - cathode-demo-chakra
          - cathode-demo-mui
          - govuk-demo-bootstrap
          - govuk-demo-shadcn
          - govuk-demo-daisyui
          - govuk-demo-echarts
          - govuk-demo-storybook
          - govuk-demo-css-variables
          - govuk-demo-radix
          - govuk-demo-primeng
          - govuk-demo-mantine
          - govuk-demo-chakra
          - govuk-demo-mui
          - carbon-demo-bootstrap
          - carbon-demo-shadcn
          - carbon-demo-daisyui
          - carbon-demo-echarts
          - carbon-demo-storybook
          - carbon-demo-css-variables
          - carbon-demo-radix
          - carbon-demo-primeng
          - carbon-demo-mantine
          - carbon-demo-chakra
          - carbon-demo-mui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes, comments, or calls the API, so the
          # checkout token has no job to do after the clone. Leaving it out of
          # .git/config keeps it away from anything the build runs.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w ${{ matrix.workspace }}

  # The one check `main` requires before a merge. Requiring every job by name
  # would mean editing the branch rules each time a demo joins the matrix, so
  # this job waits for all of them and fails if any did not succeed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, demo-projects]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
