name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Sync, catalog, fixtures, determinism, site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:sync
      - run: npm run check:grid
      - run: npm run check:fixtures
      - run: npm run check:determinism
      - run: npm run site:build

  demo-projects:
    name: Build demo — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - acme-demo-bootstrap
          - acme-demo-shadcn
          - acme-demo-daisyui
          - acme-demo-echarts
          - acme-demo-storybook
          - acme-demo-css-variables
          - cathode-demo-bootstrap
          - cathode-demo-shadcn
          - cathode-demo-daisyui
          - cathode-demo-echarts
          - cathode-demo-storybook
          - cathode-demo-css-variables
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w ${{ matrix.workspace }}
