name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Sync, catalog, fixtures, determinism, site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:sync
      - run: npm run check:doc-numbers
      - run: npm run check:format
      - run: npm run check:color
      - run: npm run check:plugins
      - run: npm run check:grid
      - run: npm run check:fixtures
      - run: npm run check:determinism
      - run: npm run check:schemas
      - run: npm run check:cli
      - run: npm run check:component-tier
      - run: npm run site:build

  demo-projects:
    name: Build demo — ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - acme-demo-bootstrap
          - acme-demo-shadcn
          - acme-demo-daisyui
          - acme-demo-echarts
          - acme-demo-storybook
          - acme-demo-css-variables
          - acme-demo-radix
          - acme-demo-primeng
          - cathode-demo-bootstrap
          - cathode-demo-shadcn
          - cathode-demo-daisyui
          - cathode-demo-echarts
          - cathode-demo-storybook
          - cathode-demo-css-variables
          - cathode-demo-radix
          - cathode-demo-primeng
          - govuk-demo-bootstrap
          - govuk-demo-shadcn
          - govuk-demo-daisyui
          - govuk-demo-echarts
          - govuk-demo-storybook
          - govuk-demo-css-variables
          - govuk-demo-radix
          - govuk-demo-primeng
          - carbon-demo-bootstrap
          - carbon-demo-shadcn
          - carbon-demo-daisyui
          - carbon-demo-echarts
          - carbon-demo-storybook
          - carbon-demo-css-variables
          - carbon-demo-radix
          - carbon-demo-primeng
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w ${{ matrix.workspace }}
