name: Release

# Never automatic. The ROADMAP's AL6 says the release executes "on explicit
# maintainer go", and ADR-0010 makes a stable release a one-way door for the
# semantic catalog — so the only trigger is a human pressing the button, and
# the button defaults to a dry run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve the dist-tag and pack the tarballs without publishing'
        type: boolean
        default: true

# Least privilege for the whole workflow, same as CI: the escalations that
# publishing genuinely needs are requested per-job, below, so they are visible.
permissions:
  contents: read

jobs:
  release:
    name: Publish @transtyle/* to npm
    runs-on: ubuntu-latest
    # npm's trusted publisher can be configured to require a named environment;
    # this is also where a required-reviewer rule belongs if one is ever wanted.
    environment: release
    permissions:
      # The OIDC token npm exchanges for publish rights. This is what replaces a
      # long-lived NPM_TOKEN: nothing secret is stored in the repo or the org.
      id-token: write
      # The release tag pushed at the end is the only write this job makes to
      # the repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Unlike CI, this job does push (tags), so the checkout token has to
          # stay in .git/config for the final step.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14; the npm that
      # ships with Node 22 is older, so it is upgraded rather than assumed.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          node -e "const [maj,min,pat]=process.versions.node.split('.').map(Number); if (maj<22 || (maj===22 && (min<14))) { console.error('Node '+process.versions.node+' is below the 22.14.0 trusted publishing needs'); process.exit(1); }"
          npm --version
      - run: npm ci

      # A release is not a place to discover the build is broken.
      - name: Full check suite
        run: npm run check:all

      # Resolves the dist-tag from .changeset/pre.json and refuses a release
      # that would arm the ADR-0010 freeze without an explicit confirmation.
      - name: Release guard
        id: guard
        run: node scripts/check-release-tag.mjs

      # Rendered here rather than next to the release that consumes it, and in
      # BOTH modes on purpose: a dry run should discover that the notes cannot
      # be built, not the real publish. Twelve changelogs say the same thing
      # twelve times under a lockstep release, so the script takes the union of
      # the substantive entries and drops the dependency-bump bookkeeping.
      - name: Render the release notes
        id: notes
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          node scripts/release-notes.mjs "$v" > release-notes.md
          echo "version=$v" >> "$GITHUB_OUTPUT"
          {
            echo "### Release notes for v$v"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # ONE step for both modes, differing only by --dry-run. They were two
      # steps, and the dry run drifted: it omitted --tag, which npm 10 tolerated
      # locally but npm 11 (installed above) rejects outright for a prerelease.
      # A dry run whose command differs from the real one is not a rehearsal, so
      # the flag is the only difference now.
      #
      # `changeset publish` is deliberately NOT used. It refuses --tag while in
      # pre mode, and with no tag its getReleaseTag() sends an alpha series to
      # `latest` from the second release onward: once every published version is
      # a prerelease, publishedState becomes "only-pre" and it falls through to
      # "latest". That would strand the `alpha` tag on alpha.0 and silently point
      # bare installs at each new alpha. `npm publish` takes the guard's resolved
      # tag every time, which is the behaviour ADR-0010's exemption relies on.
      #
      # The loop is over packages/* because --workspaces would also walk the 33
      # private demo and website workspaces.
      - name: Publish to npm
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
            echo "DRY RUN — nothing will reach the registry."
          fi
          echo "Publishing to dist-tag '${{ steps.guard.outputs.dist-tag }}'"
          for d in packages/*/; do
            npm publish $DRY -w "$d" --tag "${{ steps.guard.outputs.dist-tag }}"
          done

      # One annotated tag per release rather than twelve identical ones: the
      # fixed group guarantees every package shares the version.
      #
      # This runs BEFORE the dist-tag move, and the order is load-bearing. It
      # used to run after, and 0.1.0-alpha.2 published without ever being
      # tagged: the step below cannot succeed here (see its comment), and it
      # took the tagging down with it. Nothing after a publish should depend on
      # a step that is known to fail.
      - name: Tag the release
        if: ${{ !inputs.dry_run }}
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$v" -m "v$v"
          git push origin "v$v"

      # A tag is not a release. Until one is created, /releases is empty — and
      # that page is where someone decides whether upgrading is safe, using
      # notes that otherwise live only inside the tarballs they have not
      # downloaded yet. The first three alphas shipped with nothing there.
      #
      # `gh` is preinstalled on the runner, so this needs no extra pinned
      # action, and `contents: write` — already requested for the tag push — is
      # the only permission it uses. Prereleases are marked as such, so GitHub
      # keeps showing the last stable one as "Latest" once there is a stable
      # one to show.
      - name: Publish the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.notes.outputs.version }}"
          PRE=""
          case "$v" in *-*) PRE="--prerelease" ;; esac
          gh release create "v$v" --title "v$v" --notes-file release-notes.md $PRE

      # `npm publish --tag` sets exactly ONE tag, so the alpha channel and the
      # default channel cannot both be served by the publish itself. Policy:
      # while no stable release exists, `latest` tracks the newest alpha (a bare
      # `npm install` should get the current alpha, not whichever prerelease npm
      # auto-tagged first); once a stable release exists, prereleases never move
      # `latest` again. The script reads that condition off the registry per
      # package, so there is no flag anyone has to remember to flip.
      #
      # THIS STEP IS EXPECTED TO FAIL on npmjs.org today, and is allowed to.
      # Trusted publishing hands the job an OIDC credential scoped to publishing
      # the versions it just built; `dist-tag add` is a different write against
      # a different endpoint, and the registry rejects that credential outright
      # (E401, twelve times, on 0.1.0-alpha.2). There is no token to add that
      # would fix it without giving up the whole point of trusted publishing —
      # a long-lived NPM_TOKEN in the repo.
      #
      # So it is attempted rather than removed: it costs a few seconds, it is
      # the only thing that would notice if npm ever widens the OIDC scope, and
      # when it fails the summary below tells you the one command to run. The
      # publish has already succeeded by this point either way.
      - name: Point latest at this release (pre-stable only)
        id: latest
        continue-on-error: true
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          node scripts/sync-latest-tag.mjs $DRY

      - name: Say so if latest did not move
        if: ${{ !inputs.dry_run && steps.latest.outcome == 'failure' }}
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          {
            echo "### Published, but \`latest\` did not move"
            echo
            echo "All packages are on npm at **$v** under the \`alpha\` dist-tag, and the release is tagged."
            echo "Only the \`latest\` pointer is still on the previous version — the OIDC credential"
            echo "trusted publishing issues cannot write dist-tags."
            echo
            echo "Run this locally to finish, and answer npm's auth prompt:"
            echo
            echo '```'
            echo "npm run sync:latest-tag"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
